<!DOCTYPE html>
<html lang="{{ page.lang | default('en') }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="OEG">
    <link rel="icon" href="favicon.ico">

    <title>{{ page.title }}</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="dist/js/bootstrap.js"></script>
    <link href="dist/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="themes/blue/style.css" type="text/css" media="print, projection, screen">
    <link href="starter-template.css" rel="stylesheet">

    <style type="text/css">
      .navbar-inverse .navbar-nav > li > a {
        color: #bcbcbc;
      }
    </style>

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->

    <![endif]-->

  <body>
    <nav class="navbar navbar-inverse navbar-fixed-top" role="navigation" style="background-color: #2D73A0">
      <div class="container">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
          <ul class="nav navbar-nav">
            {% for item in navigation %}
            <li{% if item.url == page.output %} class="active"{% endif %}>
              <a href="{% if item.url == page.output %}#{% else %}{{ item.url }}{% endif %}"{% if item.url == page.output %} style="background-color:#169fe6;"{% endif %}>{{ item.label }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <br>
      <br>
      <br>
      <br>

      {% block content %}{% endblock %}
